[project]
name = "meglaping"
version = "1.0.0"
description = "Rocket League connection and input lag optimizer for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["rich>=13.0", "textual>=1.0"]

[project.scripts]
meglaping = "meglaping.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyinstaller>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["meglaping"]

[tool.setuptools.package-data]
meglaping = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
